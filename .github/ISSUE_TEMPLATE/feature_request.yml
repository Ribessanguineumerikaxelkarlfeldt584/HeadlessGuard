name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched issues and discussions for this idea.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What concrete workflow is difficult today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe the user-visible behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Safety and privacy impact
      description: Could this inspect more data, terminate more processes, or increase false-positive risk?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
