name: Missed detection
description: Report a known automation browser that Headless Guard did not identify correctly.
title: "[Missed detection]: "
labels: ["missed-detection", "needs-info"]
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I confirmed the browser belongs to an automation task.
          required: true
        - label: I removed tokens, credentials, URLs, usernames, and private paths.
          required: true
  - type: input
    attributes:
      label: Framework and browser
      placeholder: Playwright 1.x with Google Chrome
    validations:
      required: true
  - type: input
    attributes:
      label: Version and macOS
      placeholder: Headless Guard 0.1.0, macOS 15.5, arm64
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Current result
      options: [Not shown, Review only, Wrong source, Wrong browser family, Wrong process tree]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted process-tree shape and flags
      description: Describe launcher → browser → helpers and only the non-sensitive automation flags.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How was the session started and stopped?
    validations:
      required: true
