name: False positive
description: Report an ordinary or unrelated process that Headless Guard classified as automation.
title: "[False positive]: "
labels: ["safety-critical", "false-positive", "needs-info"]
body:
  - type: markdown
    attributes:
      value: "False positives are safety-critical. Disable automatic cleanup first. Never post secrets or an unredacted command line."
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I disabled automatic cleanup.
          required: true
        - label: I removed tokens, credentials, URLs, usernames, and private paths.
          required: true
  - type: input
    attributes:
      label: Version and macOS
      placeholder: Headless Guard 0.1.0, macOS 15.5, arm64
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Classification
      options: [Review only, Confirmed, Automatically cleaned, Manually cleaned]
    validations:
      required: true
  - type: textarea
    attributes:
      label: What was the process actually doing?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted evidence shown by Headless Guard
      description: Include reason titles, score, browser family, age, and process count. Do not paste a raw command line.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Impact
      description: Was an ordinary browser or unrelated task stopped? Could data have been lost?
    validations:
      required: true
