name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Swift tests and release build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build release products
        run: |
          swift build -c release --product headless-guard
          swift build -c release --product HeadlessGuardApp
      - name: Validate packaging scripts
        run: bash -n scripts/*.sh
